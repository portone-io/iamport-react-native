name: Release NPM Module

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # npm provenance용 OIDC 토큰
      contents: write # changesets가 버전 PR/태그를 생성하기 위해 필요
      pull-requests: write # changesets가 release PR을 생성/갱신하기 위해 필요
    steps:
      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Setup Node.js 24.x
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Install Dependencies
        run: pnpm install

      - name: Create Release Pull Request or stage to npm
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: pnpm --filter iamport-react-native stage publish --recursive --access public --provenance --report-summary

      - name: Notify Slack after successful npm staging
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          [[ -f pnpm-publish-summary.json ]] || exit 0
          VERSION=$(jq -r '.publishedPackages[] | select(.name == "iamport-react-native") | .version' pnpm-publish-summary.json)
          [[ -n "$VERSION" ]] || exit 0
          jq -n --arg version "$VERSION" '
            {
              blocks: [
                {type: "section", text: {type: "mrkdwn", text: ("npm에 `iamport-react-native` 버전 *v" + $version + "* 가 스테이징되었습니다. 메인테이너의 승인(2FA) 후 배포됩니다. :hourglass_flowing_sand:\n승인: npmjs.com 패키지 페이지의 *Staged Packages* 탭 또는 `npm stage list iamport-react-native` → `npm stage approve <stage-id>`\ncc <@U06QMTCTL5U>")}},
                {type: "actions", elements: [
                  {type: "button", text: {type: "plain_text", text: "npm 페이지 보기"}, url: "https://www.npmjs.com/package/iamport-react-native"},
                  {type: "button", text: {type: "plain_text", text: "체인지로그 보기"}, url: "https://github.com/iamport/iamport-react-native/blob/main/CHANGELOG.md"}
                ]}
              ]
            }' |
            curl --fail-with-body -sS -X POST -H 'Content-Type: application/json' --data-binary @- "$SLACK_WEBHOOK_URL"
