name: Release NPM Module

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # npm provenance용 OIDC 토큰
      contents: write # changesets가 버전 PR/태그를 생성하기 위해 필요
      pull-requests: write # changesets가 release PR을 생성/갱신하기 위해 필요
    steps:
      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@903f9c1a6ebcba6cf41d87230be49611ac97822e # v6.0.3
      - name: Setup Node.js 24.x
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Install Dependencies
        run: pnpm install

      - name: Create Release Pull Request or stage to npm
        uses: changesets/action@6a0a831ff30acef54f2c6aa1cbbc1096b066edaf
        with:
          publish: bash scripts/stage-npm.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BEFORE_SHA: ${{ github.event.before }}

      - name: Notify Slack after successful npm staging
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          RECEIPT="$RUNNER_TEMP/iamport-react-native-npm-stage.json"
          [[ -s "$RECEIPT" ]] || exit 0
          VERSION=$(jq -er '.version' "$RECEIPT")
          jq -n --arg version "$VERSION" '
            {
              blocks: [
                {type: "section", text: {type: "mrkdwn", text: ("npm에 `iamport-react-native` 버전 *v" + $version + "* 가 스테이징되었습니다. 메인테이너의 승인(2FA) 후 배포됩니다. :hourglass_flowing_sand:\n승인: npmjs.com 패키지 페이지의 *Staged Packages* 탭 또는 `npm stage list iamport-react-native` → `npm stage approve <stage-id>`\ncc @dx-engineers")}},
                {type: "actions", elements: [
                  {type: "button", text: {type: "plain_text", text: "npm 페이지 보기"}, url: "https://www.npmjs.com/package/iamport-react-native"},
                  {type: "button", text: {type: "plain_text", text: "체인지로그 보기"}, url: "https://github.com/iamport/iamport-react-native/blob/main/CHANGELOG.md"}
                ]}
              ]
            }' |
            curl --fail-with-body -sS -X POST -H 'Content-Type: application/json' --data-binary @- "$SLACK_WEBHOOK_URL"
