version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    groups:
      github-actions-minor-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: 'ci'
  - package-ecosystem: npm
    directory: /
    ignore:
      - dependency-name: '@portone-io/*'
      - dependency-name: '@portone/*'
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: 'chore'
